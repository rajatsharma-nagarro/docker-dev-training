version: "3.8"

services:
  mongo:
    image: mongo:6.0.17
    environment:
      MONGO_INITDB_ROOT_USERNAME: myuser
      MONGO_INITDB_ROOT_PASSWORD: mypassword
      MONGO_INITDB_DATABASE: user-information-db
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: >
        mongosh --host mongo --port 27017
        -u myuser -p mypassword --authenticationDatabase admin --quiet
        --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network

  backend:
    image: rajatsharma04/docker-training-be:1.0.1
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://myuser:mypassword@mongo:27017/user-information-db?authSource=admin
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "8080:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network

  frontend:
    image: rajatsharma04/docker-training-fe:1.0.1
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongo-data: